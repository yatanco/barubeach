name = "barubeach"
compatibility_date = "2024-09-23"

# KV namespace for availability cache (15-min TTL, same pattern as WP transients)
# Setup: wrangler kv:namespace create CACHE
# Then replace the id below with the output of that command
[[kv_namespaces]]
binding = "CACHE"
id = "replace_with_real_kv_id"

[vars]
HOSTHUB_BASE_URL = "https://app.hosthub.com/api/2019-03-01"
HOSTHUB_RENTAL_ID = "m4jmlqny2d"
PUBLIC_BASE_URL = "https://casagaviota.com"

# PriceLabs Customer API — not sensitive, just identifiers (the API key below
# is the secret). PriceLabs identifies this listing by its HostHub rental ID,
# same value as HOSTHUB_RENTAL_ID above.
PRICELABS_LISTING_ID = "m4jmlqny2d"
PRICELABS_PMS = "hosthub"

# Secrets — never committed, set via:
#   wrangler secret put HOSTHUB_API_KEY
#   wrangler secret put LEADS_WEBHOOK_URL
#   wrangler secret put HOSTHUB_ICAL_URL
#   wrangler secret put BOLD_API_KEY
#   wrangler secret put WOMPI_PUBLIC_KEY
#   wrangler secret put WOMPI_PRIVATE_KEY
#   wrangler secret put PRICELABS_API_KEY

# CRM database — add this binding after creating the database in Cloudflare:
# [[d1_databases]]
# binding = "DB"
# database_name = "barubeach-crm"
# database_id = "paste-cloudflare-database-id-here"

# HostHub iCal sync (hourly). NOTE: this project deploys via Cloudflare Pages'
# git-integration CI (see README "Deployment"), and Pages does not run a Workers
# `scheduled()` handler off this [triggers] block the way a plain Workers project
# would — Astro's Cloudflare adapter only emits a `fetch` handler. Configuring this
# alone will NOT make the sync run automatically. To actually run it hourly, either:
#   (a) point an external scheduler (cron-job.org, a GitHub Actions schedule, etc.)
#       at GET /admin/api/sync-hosthub (behind Cloudflare Access, so it needs a
#       service token), or
#   (b) migrate this project's deploy path to `wrangler deploy` with a Worker
#       entrypoint that exports both `fetch` and `scheduled`.
# Until one of those is set up, use the "Sync HostHub" button in /admin.
[triggers]
crons = ["0 * * * *"]
