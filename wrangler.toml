name = "barubeach"
compatibility_date = "2024-09-23"

# KV namespace for availability cache (15-min TTL, same pattern as WP transients)
# Setup: wrangler kv:namespace create CACHE
# Then replace the id below with the output of that command
[[kv_namespaces]]
binding = "CACHE"
id = "replace_with_real_kv_id"

[vars]
HOSTHUB_BASE_URL = "https://app.hosthub.com/api/2019-03-01"
HOSTHUB_RENTAL_ID = "m4jmlqny2d"
PUBLIC_BASE_URL = "https://casagaviota.com"

# Secrets — never committed, set via:
#   wrangler secret put HOSTHUB_API_KEY
#   wrangler secret put LEADS_WEBHOOK_URL

# CRM database — add this binding after creating the database in Cloudflare:
# [[d1_databases]]
# binding = "DB"
# database_name = "barubeach-crm"
# database_id = "paste-cloudflare-database-id-here"
